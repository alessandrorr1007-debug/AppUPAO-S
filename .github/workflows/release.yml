name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag to publish from this build'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Configure APK signing
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          UPAOS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          UPAOS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          UPAOS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          signing_file="$RUNNER_TEMP/upaos-signing.keystore"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            test -n "$UPAOS_KEYSTORE_PASSWORD" && test -n "$UPAOS_KEY_ALIAS" && test -n "$UPAOS_KEY_PASSWORD" || { echo "Missing release signing configuration"; exit 1; }
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          else
            test -n "$ANDROID_DEBUG_KEYSTORE_BASE64" || { echo "Missing APK signing secret"; exit 1; }
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
            UPAOS_KEYSTORE_PASSWORD=android
            UPAOS_KEY_ALIAS=androiddebugkey
            UPAOS_KEY_PASSWORD=android
          fi
          printf 'UPAOS_KEYSTORE_PATH=%s\n' "$signing_file" >> "$GITHUB_ENV"
          printf 'UPAOS_KEYSTORE_PASSWORD=%s\n' "$UPAOS_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'UPAOS_KEY_ALIAS=%s\n' "$UPAOS_KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'UPAOS_KEY_PASSWORD=%s\n' "$UPAOS_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test production APK
        run: ./gradlew assembleRelease testDebugUnitTest --no-daemon --console=plain

      - name: Rename APK for release
        run: |
          cp app/build/outputs/apk/release/app-release.apk UPAO-S.apk

      - name: Verify signed production APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify UPAO-S.apk
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging UPAO-S.apk)"
          if [[ "$badging" == *application-debuggable* ]]; then
            echo "Refusing to distribute a debuggable APK"
            exit 1
          fi

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upaos-signing.keystore"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: UPAO S ${{ inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            UPAO-S.apk

      - name: Upload Artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: UPAO-S-APK-${{ github.ref_name }}-${{ github.run_number }}
          path: UPAO-S.apk
          if-no-files-found: error
