name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag to publish from this build'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Configure Firebase and APK signing
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON" || { echo "Missing GOOGLE_SERVICES_JSON secret"; exit 1; }
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64" || { echo "Missing APK signing secret"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test Debug APK
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon --console=plain

      - name: Rename APK for release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk UPAO-S.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: UPAO S ${{ inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            UPAO-S.apk

      - name: Upload Artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: UPAO-S-APK-${{ github.ref_name }}-${{ github.run_number }}
          path: UPAO-S.apk
          if-no-files-found: error
